name: CI

# Spec 12a item 1: every push and every pull request runs lint, tsc and the
# unit tests. Any failure fails the build.
on:
  push:
  pull_request:

# A push to a PR branch triggers both events; keep only the newest run per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, tsc, vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The live provider tests skip themselves unless GAZELLE_LIVE_TEST=1, so
      # CI never spends API quota. Everything else runs with no secrets.
      - name: Unit tests
        run: npm test

  # Spec 12a item 2. Runs against a real `next build` + `next start` under a
  # real magic-link session, which is what CLAUDE.md means by "verified".
  #
  # It needs Supabase credentials, so it skips cleanly (green, with a log line)
  # until those repository secrets exist. Secret names only are ever printed.
  e2e:
    name: Playwright (login flow)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - name: Check for Supabase secrets
        id: secrets
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                      SUPABASE_SERVICE_ROLE_KEY ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "All four secrets are set; running the Playwright login test."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING Playwright: repository secrets not set: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            {
              echo "### Playwright skipped"
              echo "Missing repository secrets: \`${missing[*]}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.present == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.secrets.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        if: steps.secrets.outputs.present == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
